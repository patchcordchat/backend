name: patchcord

services:
  # NodeJS Backend
  api:
    container_name: api
    build: ./
    ports:
      - ${SERVER_PORT:-3000}:3000
    volumes:
      - .:/app
      - ./node_modules:/app/node_modules
    restart: always
    networks:
      - backend
    depends_on:
      mongodb:
        condition: service_healthy
        
  # MongoDB
  mongodb:
    container_name: mongodb
    image: mongo:4.4
    ports:
      - ${MONGO_PORT}:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - ./.data/db:/data/db
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Redis
  redis:
    container_name: redis
    image: redis:latest
    ports:
      - ${REDIS_PORT}:6379
    volumes:
      - ./.data/cache:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
    backend:
        driver: bridge