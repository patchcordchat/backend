services:
  # NodeJS Backend
  api:
    image: patchcord/backend:latest
    ports:
      - ${SERVER_PORT:-3000}:3000
      - ${RTC_MIN_PORT:-10000}-${RTC_MAX_PORT:-10100}:10000-10100/udp
      - ${RTC_MIN_PORT:-10000}-${RTC_MAX_PORT:-10100}:10000-10100/tcp
    env_file:
      - .env
    restart: always
    networks:
      - backend
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # MongoDB
  mongodb:
    image: mongo:4.4
    restart: always
    ports:
      - ${MONGO_PORT:-27017}:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - mongodb_data:/data/db
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Redis
  redis:
    image: redis:8.4
    ports:
      - 6379:6379
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Minio 
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data/minio --console-address ":${MINIO_CONSOLE_PORT:-9090}"
    ports:
      - ${MINIO_PORT:-9000}:9000
      - ${MINIO_CONSOLE_PORT:-9090}:9090
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - 's3_data:/data/minio'
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Create buckets for minio.
  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "while ! /usr/bin/mc ready minio; do
        /usr/bin/mc alias set minio http://minio:${MINIO_PORT:-9000} ${S3_ACCESS_KEY} ${S3_SECRET_KEY};
        echo 'Waiting minio...' && sleep 1;
      done; /usr/bin/mc mb minio/${S3_BUCKET}; exit 0;"
    networks:
      - backend

volumes:
  mongodb_data:
  redis_data:
  s3_data:

networks:
  backend:
    driver: bridge