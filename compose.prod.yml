services:
  api:
    container_name: api
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "${SERVER_PORT:-3000}:3000"
    restart: always
    environment:
      - NODE_ENV=production
      - MONGO_HOST=mongodb
      - REDIS_HOST=redis
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
  
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

  mongodb:
    image: mongo:4.4
    container_name: mongodb
    restart: always
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    volumes:
      - redis_data:/data

volumes:
  mongodb_data:
  redis_data:

networks:
  backend:
    driver: bridge