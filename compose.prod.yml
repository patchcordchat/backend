services:
  # NodeJS Backend
  api:
    build: 
      context: .
      target: prod
    ports:
      - "${SERVER_PORT:-3000}:3000"
    restart: always
    environment:
      - NODE_ENV=production
      - MONGO_HOST=mongodb
      - REDIS_HOST=redis
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Nginx
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

  # MongoDB
  mongodb:
    image: mongo:4.4
    restart: always
    volumes:
      - mongodb_data:/data/db

  # Redis
  redis:
    image: redis:latest
    restart: always
    volumes:
      - redis_data:/data

volumes:
  mongodb_data:
  redis_data:

networks:
  backend:
    driver: bridge